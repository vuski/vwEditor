[package]
name = "vweditor"
version = "1.0.1"
edition = "2021"

[dependencies]
eframe = "0.28"
egui = "0.28"
egui_extras = "0.28"
memmap2 = "0.9"
csv-core = "0.1"
encoding_rs = "0.8"
rfd = "0.14"
rayon = "1"
memchr = "2"
# OS 로케일에서 시작 언어를 정한다(src/i18n.rs). Windows는
# GetUserDefaultLocaleName, 맥·리눅스는 각자 관례를 이 크레이트가 흡수한다.
sys-locale = "0.3"
# Windows 기본 힙(RtlAllocateHeap)이 이 앱 비용의 큰 몫이다 — 15.4M행 파일에서
# 전체 바꾸기 시간의 61%가 할당자였다(측정). main.rs의 #[global_allocator] 참조.
mimalloc = "0.1"

# ---- Parquet(GeoParquet) 읽기 전용 뷰어 ----
# `arrow`를 별도 의존성으로 적지 않는다 — parquet의 `arrow` feature가 맞는
# 버전의 arrow-* 크레이트를 끌어온다. 따로 적으면 버전이 어긋난다.
# 이 feature는 뺄 수 없다: `parquet::arrow` 모듈 전체(ProjectionMask,
# ParquetRecordBatchReaderBuilder)가 그 게이트 뒤에 있다.
# default-features=false로 brotli/lz4/flate2/simdutf8을 뺀다 — snappy와
# zstd가 실무 Parquet의 대부분이고, 빠진 압축은 열 때 오류로 안내한다.
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"] }
# 셀 값 문자열화(timestamp/decimal/date를 손으로 포맷하지 않는다).
arrow-array = "59"
arrow-cast = "59"
arrow-schema = "59"
# GeoParquet의 `geo` 키-값 메타데이터(JSON) 파싱 전용. 손으로 파싱하면
# 이스케이프된 따옴표 하나에 멀쩡한 컬럼을 geometry로 오인한다.
serde_json = "1"

# exe에 아이콘을 심는 데만 쓴다(build.rs 참조). Windows 외에서는 no-op.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
